[package]
name = "wagmi-omnichain-app"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "wagmi_omnichain_app"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]


[dependencies]
anchor-lang = { version = "0.29.0", features = ['init-if-needed']}
anchor-spl = '0.29.0'
oapp = { git = "https://github.com/HlibProtasov/layer0Solana.git" }



